name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run demo
      - name: npm pack smoke
        shell: bash
        run: |
          set -euo pipefail
          npm pack
          rm -rf ci-pack ci-smoke
          mkdir -p ci-pack ci-smoke
          tar -xzf taskfootprint-*.tgz -C ci-pack
          node ci-pack/package/dist/cli/index.js --help
          node ci-pack/package/dist/cli/index.js --version
          cd ci-smoke
          printf '%s\n' '{"name":"tf-smoke","private":true}' > package.json
          npm install ../taskfootprint-*.tgz
          npx taskfootprint --help


